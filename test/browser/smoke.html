<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pts-render browser smoke</title>
    <script type="importmap">
      {
        "imports": {
          "pts": "/node_modules/pts/dist/index.mjs"
        }
      }
    </script>
    <style>
      #pt,
      #pt-function,
      #pt-sized {
        width: 64px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div id="pt"></div>
    <div id="pt-function"></div>
    <div id="pt-sized"></div>
    <output id="result">pending</output>
    <script type="module">
      import * as Pts from "pts";
      import { mountScene } from "/dist/browser.mjs";

      const calls = [];
      let cleanupCalls = 0;
      let functionThisIsPlayer = false;
      const scene = {
        apiVersion: 1,
        width: 64,
        height: 40,
        background: "#010203",
        async run({ Pts: contextPts, space, form, params, assets }) {
          if (contextPts !== Pts) throw new Error("Pts namespace mismatch");
          if (!(space instanceof Pts.CanvasSpace)) {
            throw new Error("space is not a CanvasSpace");
          }
          if (form.space !== space) throw new Error("form/space mismatch");
          if (params.label !== "browser") throw new Error("params mismatch");
          await new Promise((resolve) => setTimeout(resolve, 20));
          const imageRequest = assets.image("/test/fixtures/assets/square.svg");
          if (
            assets.image("/test/fixtures/assets/square.svg") !== imageRequest
          ) {
            throw new Error("browser image requests were not deduplicated");
          }
          const image = await imageRequest;

          const first = {
            resize() {
              calls.push("first:resize");
              space.add({
                resize() {
                  calls.push("from-resize:resize");
                },
                start() {
                  calls.push("from-resize:start");
                },
              });
            },
            start() {
              calls.push("first:start");
              space.add({
                resize() {
                  calls.push("from-start:resize");
                },
                start() {
                  calls.push("from-start:start");
                },
              });
            },
            animate() {
              form.fillOnly("#00ff00").rect([
                [0, 0],
                [64, 40],
              ]);
              form.image(
                [
                  [4, 4],
                  [12, 12],
                ],
                image,
              );
            },
          };
          const second = {
            resize() {
              calls.push("second:resize");
            },
            start() {
              calls.push("second:start");
            },
          };
          const removed = {
            resize() {
              calls.push("removed:resize");
            },
            start() {
              calls.push("removed:start");
            },
          };
          const replaced = { animateID: "duplicate" };
          const replacement = {
            animateID: "duplicate",
            resize() {
              calls.push("replacement:resize");
            },
            start() {
              calls.push("replacement:start");
            },
          };
          const functionPlayer = function () {
            functionThisIsPlayer = this.animate === functionPlayer;
          };

          space.add(first);
          space.add(second);
          space.add(removed).remove(removed);
          space.add(replaced).add(replacement);
          space.add(functionPlayer);
          return () => {
            cleanupCalls += 1;
          };
        },
      };

      try {
        const mounted = await mountScene(scene, {
          target: "#pt",
          resize: false,
          retina: false,
          autoplay: false,
          bindMouse: false,
          bindTouch: false,
          params: { label: "browser" },
          assetBaseURL: import.meta.url,
        });
        const expected = [
          "first:resize",
          "second:resize",
          "replacement:resize",
          "first:start",
          "second:start",
          "replacement:start",
          "from-resize:resize",
          "from-start:resize",
          "from-resize:start",
          "from-start:start",
        ];
        if (JSON.stringify(calls) !== JSON.stringify(expected)) {
          throw new Error("lifecycle mismatch: " + JSON.stringify(calls));
        }

        mounted.space.add({
          resize() {
            calls.push("late:resize");
          },
          start() {
            calls.push("late:start");
          },
        });
        if (calls.at(-1) !== "late:resize" || calls.includes("late:start")) {
          throw new Error("late-add policy mismatch");
        }

        mounted.space.playOnce(0);
        await new Promise((resolve) =>
          requestAnimationFrame(() => requestAnimationFrame(resolve)),
        );
        if (!functionThisIsPlayer) throw new Error("function this mismatch");
        await mounted.dispose();
        await mounted.dispose();
        if (cleanupCalls !== 1) throw new Error("cleanup was not idempotent");

        let directRunCalls = 0;
        const functionMounted = await mountScene(
          function run({ space }) {
            directRunCalls += 1;
            space.add(() => {});
          },
          {
            target: "#pt-function",
            resize: false,
            retina: false,
            autoplay: false,
            bindMouse: false,
            bindTouch: false,
          },
        );
        if (directRunCalls !== 1) {
          throw new Error("default-exported run function was not called once");
        }
        await functionMounted.dispose();

        for (const cleanupThrows of [false, true]) {
          const controller = new AbortController();
          let enterRun;
          let finishRun;
          const entered = new Promise((resolve) => {
            enterRun = resolve;
          });
          const finish = new Promise((resolve) => {
            finishRun = resolve;
          });
          let lateCleanupCalls = 0;
          let starts = 0;
          const mounting = mountScene(
            async ({ space }) => {
              enterRun();
              await finish;
              space.add({
                start() {
                  starts++;
                },
              });
              return async () => {
                lateCleanupCalls++;
                await Promise.resolve();
                if (cleanupThrows) throw new Error("cleanup failure");
              };
            },
            {
              target: "#pt-function",
              signal: controller.signal,
              autoplay: false,
              resize: false,
            },
          );
          await entered;
          controller.abort();
          finishRun();
          let error;
          try {
            await mounting;
          } catch (caught) {
            error = caught;
          }
          if (
            error?.name !== "AbortError" ||
            lateCleanupCalls !== 1 ||
            starts !== 0
          ) {
            throw new Error(
              "Abort during setup lost cleanup or started a cancelled player",
            );
          }
        }

        const mountedController = new AbortController();
        let disposeCalls = 0;
        const abortMounted = await mountScene(
          () => () => {
            disposeCalls++;
          },
          {
            target: "#pt-function",
            signal: mountedController.signal,
            autoplay: false,
            resize: false,
          },
        );
        mountedController.abort();
        await abortMounted.dispose();
        await abortMounted.dispose();
        if (disposeCalls !== 1)
          throw new Error("Abort after mounting duplicated cleanup");

        const preAborted = new AbortController();
        preAborted.abort();
        let cancelledRunCalls = 0;
        try {
          await mountScene(
            () => {
              cancelledRunCalls++;
            },
            { target: "#pt-function", signal: preAborted.signal },
          );
          throw new Error("Pre-aborted mount succeeded");
        } catch (error) {
          if (error.name !== "AbortError" || cancelledRunCalls !== 0)
            throw error;
        }

        try {
          await mountScene(() => {}, { target: "#pt-missing" });
          throw new Error("Missing target mounted");
        } catch (error) {
          if (
            !(error instanceof TypeError) ||
            !/did not match/.test(error.message)
          ) {
            throw error;
          }
        }
        if (document.querySelector("#pt-missing_container")) {
          throw new Error("Missing target created a container");
        }

        const settle = () => new Promise((resolve) => setTimeout(resolve, 120));
        const sized = await mountScene(
          ({ space }) => {
            space.add(() => {});
          },
          {
            target: "#pt-sized",
            size: { width: 30, height: 20 },
            retina: false,
            autoplay: false,
          },
        );
        await settle();
        if (
          sized.space.element.width !== 30 ||
          sized.space.element.height !== 20
        ) {
          throw new Error(
            "explicit size was overridden: " +
              sized.space.element.width +
              "x" +
              sized.space.element.height,
          );
        }
        await sized.dispose();

        const sceneSized = await mountScene(
          { width: 40, height: 24, run() {} },
          { target: "#pt-sized", retina: false, autoplay: false },
        );
        await settle();
        if (
          sceneSized.space.element.width !== 40 ||
          sceneSized.space.element.height !== 24
        ) {
          throw new Error("scene size was overridden by the container");
        }
        await sceneSized.dispose();

        const followsContainer = await mountScene(
          { width: 40, height: 24, run() {} },
          { target: "#pt-sized", resize: true, retina: false, autoplay: false },
        );
        await settle();
        if (followsContainer.space.element.width !== 64) {
          throw new Error("explicit resize: true did not follow the container");
        }
        await followsContainer.dispose();

        document.body.dataset.status = "passed";
        document.querySelector("#result").textContent = "browser smoke passed";
      } catch (error) {
        document.body.dataset.status = "failed";
        document.querySelector("#result").textContent =
          error instanceof Error ? error.stack : String(error);
      }
    </script>
  </body>
</html>
